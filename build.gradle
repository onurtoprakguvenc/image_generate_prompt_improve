plugins {
    id 'java'
    id 'application'
}

group = 'com.promptcompiler'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Robust JSON serialization and schema parsing for Gemini API payloads
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

application {
    mainClass = 'com.promptcompiler.VisualPromptApp'
}

// Ensures Gradle does not disconnect or buffer standard input during interactive execution
run {
    standardInput = System.in
}